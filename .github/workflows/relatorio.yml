name: Relatório Weni

on:
  schedule:
   - cron: "7 10,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Restaurar cache de mensagens/contatos já buscados
        uses: actions/cache@v4
        with:
          path: data
          key: weni-cache-${{ github.run_id }}
          restore-keys: |
            weni-cache-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar relatório
        env:
          WENI_API_TOKEN: ${{ secrets.WENI_API_TOKEN }}
        run: python gerar_relatorio.py

      - name: Commitar relatório atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Atualiza relatório automático"
          git push
